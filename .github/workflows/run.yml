name: Run BOT and Upload to Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt notebook nbconvert jupyter

      - run: python -m jupyter nbconvert --to notebook --execute BOT_FPO_DATA.ipynb --output executed.ipynb
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - run: python upload_to_drive.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
