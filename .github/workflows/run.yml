name: Run BOT FPO and Upload to Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # 10:00 ไทย
    - cron: "0 7 * * *"  # 14:00 ไทย

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt notebook nbconvert jupyter

      - name: Run BOT
        run: python -m jupyter nbconvert --to notebook --execute BOT_DATA.ipynb --output executed_bot.ipynb
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Run FPO
        run: python -m jupyter nbconvert --to notebook --execute FPO_DATA.ipynb --output executed_fpo.ipynb

      - name: Upload to Google Drive
        run: python upload_to_drive.py
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
